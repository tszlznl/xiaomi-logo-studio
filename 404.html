<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>页面不存在 · 小米 Logo 几何工坊</title>
<meta name="description" content="访问的页面不存在。小米 Logo 几何工坊是一个单页工具，可在 x³+y³=1 超椭圆上调节小米 Logo 的几何参数并导出 SVG / PNG。">
<style>
  :root { --accent: #ff6900; --muted: #71717a; --text: #18181b; --line: #e6e6e9; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text); background: #f4f4f5;
  }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 20px;
    padding: 40px 36px; max-width: 480px; width: 100%; text-align: center;
  }
  .mark {
    width: 84px; height: 84px; margin: 0 auto 22px; background: var(--accent);
    border-radius: 38%; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: 26px; letter-spacing: .02em;
  }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.8; color: var(--muted); margin: 0 0 26px; }
  a.button {
    display: inline-block; padding: 11px 22px; border-radius: 12px; text-decoration: none;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
  }
  a.text { display: inline-block; margin-top: 16px; font-size: 12.5px; color: var(--muted); }
  .langs { margin: 18px 0 0; font-size: 12.5px; }
  .langs a { color: var(--muted); text-decoration: none; }
  .langs a:hover { color: var(--accent); }
  a.button:hover, a.text:hover { filter: brightness(.97); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">mi</div>
    <h1>这里没有页面</h1>
    <p>本站只有一个工具页，你访问的地址不存在或已被移动。回到工具页可以继续调节超椭圆轮廓、mi 字形与圆角参数，并导出 SVG / PNG。</p>
    <a class="button" href="/">返回小米 Logo 几何工坊</a>
    <br>
    <a class="text" href="https://github.com/tszlznl/xiaomi-logo-studio" rel="noreferrer">查看源码仓库</a>
    <p class="langs"><a href="/en/" hreflang="en">English</a> · <a href="/ja/" hreflang="ja">日本語</a> · <a href="/de/" hreflang="de">Deutsch</a> · <a href="/nl/" hreflang="nl">Nederlands</a></p>
  </main>
</body>
</html>
